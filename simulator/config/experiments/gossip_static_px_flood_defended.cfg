# PX flood attack scenario with all three defenses enabled.
# Based on degraded_baseline_r20_windowed_px_control_dout but adds PX flood defenses.
# Load this after config/gossipdas1k.cfg.
# graft_rejection_px_enabled is overridden to true by run_px_flood.py at runtime.

random.seed 24680
simulation.experiments 1

gossipsub.score.enabled false
gossipsub.degraded.peer.ratio 0.20
gossipsub.degraded.peer.withhold.probability 1.0
gossipsub.single_topic.enabled true
gossipsub.single_topic.name gossipsub-inference
gossipsub.opportunistic_graft.ticks 15
gossipsub.opportunistic_graft.threshold 0.35
gossipsub.opportunistic_graft.peers 2
gossipsub.d_out 2
gossipsub.prune_peers 16
gossipsub.accept_px_threshold 0.25
gossipsub.candidate_ttl_heartbeats 1000000
gossipsub.candidate_px_hint_ttl_heartbeats 1000000
gossipsub.candidate_selected_ttl_heartbeats 0
gossipsub.candidate_cleanup_interval_heartbeats 1
gossipsub.candidate_pool_max_per_topic 1000000
gossipsub.repair_relax_received_prune_for_d_out false
gossipsub.repair_relax_received_prune_budget_per_heartbeat 1
gossipsub.repair_relax_received_prune_min_score 0.0
gossipsub.repair_relax_received_prune_local_grace_enabled false
gossipsub.receiver_relax_graft_backoff_for_d_out false
gossipsub.d_out_inplace_promotion_enabled false
gossipsub.d_out_forced_reseed_enabled false

# Defense 1: per-requester PX backoff (200 hb >> prune_backoff of 60 hb)
gossipsub.px_defense.requester_backoff_enabled true
gossipsub.px_defense.requester_backoff_heartbeats 200

# Defense 2: global rate limit — D_high(8) * 3 = 24 peers per 30 hb window
gossipsub.px_defense.rate_limit_enabled true
gossipsub.px_defense.rate_limit_budget 24
gossipsub.px_defense.rate_limit_window_heartbeats 30

# Defense 3: flood detection — D_out(2) + 2 = 4 simultaneous GRAFTs triggers suppression
gossipsub.px_defense.flood_detection_enabled true
gossipsub.px_defense.flood_detection_graft_threshold 4
gossipsub.px_defense.flood_detection_window_heartbeats 2

control.0traffic.step 30000
control.0traffic.block_dim_size 32
control.0traffic.num_samples 146

control.4.logfolder results/gossip_static_px_flood_defended
