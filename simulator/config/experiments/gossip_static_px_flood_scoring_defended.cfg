# PX flood attack on the validated scoring scenario with all three defenses enabled.
# Based on degraded_scoring_r20_validated but adds PX flood defenses.
# Load this after config/gossipdas1k.cfg.
# graft_rejection_px_enabled is overridden to true by run_px_flood.py at runtime.

random.seed 24680
simulation.experiments 1

gossipsub.score.enabled true
gossipsub.degraded.peer.ratio 0.20
gossipsub.degraded.peer.withhold.probability 1.0
gossipsub.degraded.peer.forward_drop.probability 1.0
gossipsub.single_topic.enabled true
gossipsub.single_topic.name gossipsub-inference

gossipsub.d 8
gossipsub.d_low 6
gossipsub.d_high 15
gossipsub.d_score 6
gossipsub.d_out 2

gossipsub.candidate_ttl_heartbeats 300
gossipsub.candidate_pool_max_per_topic 512
gossipsub.local_connect_attempts_per_topic_per_heartbeat 12
gossipsub.local_connectable_registry_activity_ttl_heartbeats 300

gossipsub.score.weight_broken_promises 8.0
gossipsub.score.weight_first_deliveries 0.1
gossipsub.score.weight_time_in_mesh 0.0
gossipsub.score.degraded_peer_penalty 100.0
gossipsub.score.promise_timeout_heartbeats 2
gossipsub.score.decay_broken_promises 0.999

gossipsub.opportunistic_graft.ticks 5
gossipsub.opportunistic_graft.peers 2
gossipsub.opportunistic_graft.threshold 0.25

# Defense 1: per-requester PX backoff (200 hb >> prune_backoff of 60 hb)
gossipsub.px_defense.requester_backoff_enabled true
gossipsub.px_defense.requester_backoff_heartbeats 200

# Defense 2: global rate limit — D_high(15) * 3 = 45 peers per 30 hb window
gossipsub.px_defense.rate_limit_enabled true
gossipsub.px_defense.rate_limit_budget 45
gossipsub.px_defense.rate_limit_window_heartbeats 30

# Defense 3: flood detection — D_out(2) + 2 = 4 simultaneous GRAFTs triggers suppression
gossipsub.px_defense.flood_detection_enabled true
gossipsub.px_defense.flood_detection_graft_threshold 4
gossipsub.px_defense.flood_detection_window_heartbeats 2

control.0traffic.step 30000
control.0traffic.block_dim_size 32
control.0traffic.num_samples 146

control.4.logfolder results/gossip_static_px_flood_scoring_defended
